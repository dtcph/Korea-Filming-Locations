<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Page</title>

    <style>
      body {
        box-sizing: border-box;

        width: 100vw;
        height: 100vh;

        padding: 4rem;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background-color: rgb(12, 14, 16);
        color: rgb(245, 240, 240);

        font-size: 4rem;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      p {
        max-width: 40%;
      }
    </style>
  </head>
  <body>
    <h1>안녕하세요~</h1>
    <p>혹시 몰라서 인트로 문장을 준비해 놓았음.</p>
    <section>저 폴이라고요~</section>
  </body>
  <script>
    let hue = 0;

    setInterval(() => {
      document.body.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
      hue = (hue + 3) % 360;
    }, 50);
  </script>
</html>
