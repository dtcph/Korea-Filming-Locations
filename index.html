<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FRAME — Korea Filming Locations</title>
    <!-- OSM's tile policy needs a Referer; keep the origin-only default explicit -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">FRAME</span>
        <span class="brand-sub" id="brand-sub"
          >Korea Filming Location Explorer</span
        >
      </div>
      <div class="filters" role="group" aria-label="Filters">
        <div class="filter-group">
          <span class="filter-label" id="label-type">Type</span>
          <div class="chip-row" id="type-filters"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label" id="label-language">Language</span>
          <div
            class="segmented"
            id="language-filters"
            role="radiogroup"
            aria-label="Language"
          ></div>
        </div>
        <div class="filter-group search-group">
          <span class="filter-label" id="label-search" for="search-input"
            >Search</span
          >
          <input
            id="search-input"
            type="text"
            placeholder="Search title…"
            autocomplete="off"
          />
        </div>
        <button
          id="reset-view"
          class="back-btn"
          title="Back to national view (Esc)"
          disabled
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path
              d="M8.5 2 3 7l5.5 5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span id="reset-view-label">National view</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="map-pane">
        <div class="map-head">
          <h1 id="map-title">대한민국 — 촬영지 밀도</h1>
          <p id="map-sub" class="muted">
            지역에 마우스를 올려 미리보세요. 스크롤로 확대·축소, 드래그로 이동할
            수 있고 충분히 확대하면 개별 촬영지가 나타납니다. 지역을 클릭하면
            바로 이동합니다.
          </p>
        </div>
        <div class="map-wrap" id="map-wrap">
          <div id="map" aria-label="Map of South Korea filming locations"></div>
          <div class="map-status" id="map-status" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span id="map-status-text">Loading map…</span>
          </div>
          <div class="map-notice" id="map-notice" role="alert" hidden></div>
          <div class="legend" id="legend"></div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <p class="unlocated-note" id="unlocated-note"></p>
      </section>

      <aside class="stats-pane" id="stats-pane">
        <div class="stats-head" aria-live="polite">
          <h2 id="stats-title">대한민국 전체</h2>
          <p class="muted" id="stats-sub"></p>
        </div>

        <div class="stat-tiles" id="stat-tiles"></div>

        <div class="stats-block">
          <h3 id="type-breakdown-heading">유형별</h3>
          <div id="type-breakdown" class="bar-list"></div>
        </div>

        <div class="stats-block" id="detail-block" hidden>
          <h3 id="detail-title">위치</h3>
          <dl class="detail-list" id="detail-list"></dl>
        </div>

        <div class="stats-block">
          <h3 id="list-heading">건수별 지역</h3>
          <ul class="record-list" id="record-list"></ul>
        </div>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
