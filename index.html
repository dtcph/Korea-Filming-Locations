<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Page</title>

    <style>
      body {
        box-sizing: border-box;

        width: 100vw;
        height: 100vh;

        padding: 4rem;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background-color: rgb(12, 14, 16);
        color: rgb(245, 240, 240);

        font-size: 4rem;
        font-family: Chalkboard, Arial, Helvetica, sans-serif;
        font-weight: 700;
      }

      p {
        max-width: 40%;
      }
    </style>
  </head>
  <body>
    <h1 id="h1" class="word">&nbsp;&nbsp;</h1>
    <script>
      var words = ["Hi, I am Paul.", "Hello World", "안녕하세요~"],
        part,
        i = 0,
        offset = 0,
        len = words.length,
        forwards = true,
        skip_count = 0,
        skip_delay = 30,
        speed = 70;
      var wordflick = function () {
        setInterval(function () {
          if (forwards) {
            if (offset >= words[i].length) {
              ++skip_count;
              if (skip_count == skip_delay) {
                forwards = false;
                skip_count = 0;
              }
            }
          } else {
            if (offset == 0) {
              forwards = true;
              i++;
              offset = 0;
              if (i >= len) {
                i = 0;
              }
            }
          }
          part = words[i].substr(0, offset);
          if (skip_count == 0) {
            if (forwards) {
              offset++;
            } else {
              offset--;
            }
          }
          document.querySelector(".word").textContent = part;
        }, speed);
      };

      wordflick();
    </script>
    <p>혹시 몰라서 인트로 문장을 준비해 놓았음.</p>
    <section>이 웹사이트가 이쁘죠~^^</section>
  </body>
  <script>
    let hue = 0;

    setInterval(() => {
      document.body.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
      document.getElementById("h1").style.color = `hsl(${hue * -1}, 100%, 50%)`;
      hue = (hue + 3) % 360;
    }, 100);
  </script>
</html>
